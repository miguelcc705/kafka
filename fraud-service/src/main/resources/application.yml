server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: fraud-service
  profiles:
    default: local
  datasource:
    url: ${FRAUD_DB_URL:jdbc:postgresql://localhost:5433/fraud}
    username: ${FRAUD_DB_USER:fraud}
    password: ${FRAUD_DB_PASSWORD:fraud}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

fraud:
  rules:
    amount-threshold: ${FRAUD_RULES_AMOUNT_THRESHOLD:10000000}
    velocity-max-transfers: ${FRAUD_RULES_VELOCITY_MAX_TRANSFERS:3}
    velocity-window: ${FRAUD_RULES_VELOCITY_WINDOW:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
