server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: fraud-service
  profiles:
    default: local
  datasource:
    url: ${FRAUD_DB_URL:jdbc:postgresql://localhost:5433/fraud}
    username: ${FRAUD_DB_USER:fraud}
    password: ${FRAUD_DB_PASSWORD:fraud}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # El contrato es el JSON: sin headers con el nombre de la clase Java.
        spring.json.add.type.headers: false
    consumer:
      group-id: fraud-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.fraud.messaging.TransferCreatedEvent
    listener:
      ack-mode: record

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fraud:
  rules:
    amount-threshold: ${FRAUD_RULES_AMOUNT_THRESHOLD:10000000}
    velocity-max-transfers: ${FRAUD_RULES_VELOCITY_MAX_TRANSFERS:3}
    velocity-window: ${FRAUD_RULES_VELOCITY_WINDOW:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
