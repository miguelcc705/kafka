server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: transfer-service
  profiles:
    default: local
  datasource:
    url: ${TRANSFER_DB_URL:jdbc:postgresql://localhost:5432/transfers}
    username: ${TRANSFER_DB_USER:transfer}
    password: ${TRANSFER_DB_PASSWORD:transfer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # El contrato es el JSON: sin headers con el nombre de la clase Java.
        spring.json.add.type.headers: false
    consumer:
      group-id: transfer-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.transfer.messaging.TransferEvaluatedEvent
    listener:
      ack-mode: record

transfer:
  outbox:
    poll-interval: ${TRANSFER_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${TRANSFER_OUTBOX_BATCH_SIZE:100}
    send-timeout: ${TRANSFER_OUTBOX_SEND_TIMEOUT:10s}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
