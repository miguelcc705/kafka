server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: transfer-service
  profiles:
    default: local
  datasource:
    url: ${TRANSFER_DB_URL:jdbc:postgresql://localhost:5432/transfers}
    username: ${TRANSFER_DB_USER:transfer}
    password: ${TRANSFER_DB_PASSWORD:transfer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
