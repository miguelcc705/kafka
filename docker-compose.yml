name: transfer-fraud-system

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: tráfico entre contenedores. PLAINTEXT_HOST: servicios corriendo en el IDE (perfil local).
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los topics los crea cada servicio con beans NewTopic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["ui"]
    ports:
      - "${KAFKA_UI_HOST_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  transfer-db:
    image: postgres:18.7-alpine
    ports:
      - "${TRANSFER_DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: ${TRANSFER_DB_USER:-transfer}
      POSTGRES_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer}
    volumes:
      - transfer-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  fraud-db:
    image: postgres:18.7-alpine
    ports:
      - "${FRAUD_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: ${FRAUD_DB_USER:-fraud}
      POSTGRES_PASSWORD: ${FRAUD_DB_PASSWORD:-fraud}
    volumes:
      - fraud-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    ports:
      - "${TRANSFER_SERVICE_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TRANSFER_DB_USER: ${TRANSFER_DB_USER:-transfer}
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer}
    depends_on:
      kafka:
        condition: service_healthy
      transfer-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fraud-service:
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
    ports:
      - "${FRAUD_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FRAUD_DB_USER: ${FRAUD_DB_USER:-fraud}
      FRAUD_DB_PASSWORD: ${FRAUD_DB_PASSWORD:-fraud}
      FRAUD_RULES_AMOUNT_THRESHOLD: ${FRAUD_RULES_AMOUNT_THRESHOLD:-10000000}
      FRAUD_RULES_VELOCITY_MAX_TRANSFERS: ${FRAUD_RULES_VELOCITY_MAX_TRANSFERS:-3}
      FRAUD_RULES_VELOCITY_WINDOW: ${FRAUD_RULES_VELOCITY_WINDOW:-60s}
    depends_on:
      kafka:
        condition: service_healthy
      fraud-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  transfer-db-data:
  fraud-db-data:
